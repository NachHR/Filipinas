<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17211f">
<meta name="description" content="Diario e itinerario bilingüe de viaje por Filipinas.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="today.css">
<title>Filipinas · Diario de viaje</title>
</head>
<body>
<header class="topbar">
  <button id="menuButton" class="icon-button" aria-label="Abrir menú">☰</button>
  <div class="brand"><span class="brand-mark">✦</span><div><span id="brandTitle" class="brand-title">FILIPINAS</span><span id="brandSubtitle" class="brand-subtitle">Diario de viaje</span><span id="connectionStatus" class="connection-status online"><i></i> <span>Online</span></span></div></div>
  <div class="top-actions"><button id="todayButton" class="small-button">Hoy</button><button id="languageToggle" class="lang-button">ES / EN</button></div>
</header>
<aside id="sidePanel" class="side-panel" aria-hidden="true">
  <div class="side-head"><strong id="navTitle">Navegación</strong><button id="closeMenu" class="icon-button" aria-label="Cerrar">×</button></div>
  <div class="quick-nav">
    <button id="menuToday" class="menu-action">⌂ <span>Hoy</span></button>
    <button id="menuBudget" class="menu-action">💰 <span>Presupuesto</span></button>
    <button id="menuInstall" class="menu-action" hidden>📲 <span>Instalar</span></button>
  </div>
  <div class="menu-divider"></div>
  <div id="locationNav" class="location-nav"></div>
  <div class="side-settings">
    <button id="itineraryModeButton" class="mode-button">◉ <span id="modeLabel">Solo itinerario</span></button>
    <div id="menuConnection" class="menu-connection"><i></i><span>Conexión</span></div>
  </div>
</aside>
<div id="overlay" class="overlay"></div>
<main><section id="hero" class="hero"></section><nav id="dayNavigation" class="day-navigation" aria-label="Navegación por días"></nav><section id="dayContent" class="day-content" aria-live="polite"></section></main>
<footer class="footer"><div>Filipinas · 2026</div><div class="creator-credit">Creado por NachHR con la ayuda de ChatGPT</div></footer>
<dialog id="budgetDialog" class="budget-dialog"><form method="dialog" id="budgetDialogForm"><div class="dialog-card"><div class="section-head"><h2 id="budgetDialogTitle">Presupuesto</h2><button class="icon-button" value="cancel" aria-label="Cerrar">×</button></div><p id="budgetDialogHelp">Cambia aquí el presupuesto total del viaje. Se guarda en este dispositivo.</p><label id="budgetDialogLabel" for="budgetDialogInput">Presupuesto total (PHP)</label><input id="budgetDialogInput" type="number" min="1" step="1"><div class="dialog-actions"><button class="action" value="cancel">Cancelar</button><button class="action primary" id="saveBudgetButton" value="default">Guardar</button></div></div></form></dialog><div class="version-badge">V8.4.0</div>
<script src="data.js?v=8.4.0"></script><script src="photos.js?v=8.4.0"></script><script src="script.js?v=8.4.0"></script><script src="today.js?v=8.4.0"></script>
</body></html>
