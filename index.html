<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#17211f" />
    <meta
      name="description"
      content="Diario e itinerario bilingüe puerta a puerta para un viaje a Filipinas."
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="style.css?v=8.8.1" />
    <link rel="stylesheet" href="today.css?v=8.8.1" />
    <link rel="stylesheet" href="budget.css?v=8.8.1" />
    <link rel="stylesheet" href="field-notes.css?v=8.8.1" />
    <style>
      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        overflow: hidden;
        display: block;
        flex: 0 0 28px;
      }
      .brand-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .icon-button {
        font-size: 22px;
        line-height: 1;
      }
      .today-before .today-action {
        display: flex;
        width: 100%;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 14px;
      }
      .today-before .today-action + .today-action {
        margin-top: 10px;
      }
      .connection-status.offline i,
      .menu-connection.offline i {
        background: #9b655b !important;
      }
      .connection-status.online i,
      .menu-connection.online i {
        background: #42675b !important;
      }
    </style>
    <title>Filipinas · Diario de viaje</title>
  </head>
  <body>
    <header class="topbar">
      <button id="menuButton" class="icon-button" aria-label="Abrir menú">
        ☰
      </button>
      <div class="brand">
        <span class="brand-mark"
          ><img id="brandFlag" src="flag-ph.svg" alt="Bandera de Filipinas"
        /></span>
        <div>
          <span id="brandTitle" class="brand-title">FILIPINAS</span
          ><span id="brandSubtitle" class="brand-subtitle">Diario de viaje</span
          ><span id="connectionStatus" class="connection-status online"
            ><i aria-hidden="true"></i> <span>Conectado</span></span
          >
        </div>
      </div>
      <div class="top-actions">
        <button id="todayButton" class="small-button">Hoy</button
        ><button id="languageToggle" class="lang-button">ES / EN</button>
      </div>
    </header>
    <aside id="sidePanel" class="side-panel" aria-hidden="true">
      <div class="side-head">
        <strong id="navTitle">Navegación</strong
        ><button id="closeMenu" class="icon-button" aria-label="Cerrar">
          ×
        </button>
      </div>
      <div class="quick-nav">
        <button id="menuToday" class="menu-action">
          ⌂ <span id="menuTodayText">Hoy</span></button
        ><button id="menuBudget" class="menu-action">
          💰 <span id="menuBudgetText">Presupuesto</span></button
        ><button id="menuInstall" class="menu-action" hidden>
          📲 <span id="menuInstallText">Instalar</span>
        </button>
      </div>
      <div class="menu-divider"></div>
      <div id="locationNav" class="location-nav"></div>
      <div class="side-settings">
        <button id="itineraryModeButton" class="mode-button">
          ◉ <span id="modeLabel">Ocultar rodaje</span>
        </button>
        <div id="menuConnection" class="menu-connection online">
          <i aria-hidden="true"></i><span>Conectado</span>
        </div>
      </div>
    </aside>
    <div id="overlay" class="overlay"></div>
    <main>
      <section id="hero" class="hero"></section>
      <nav
        id="dayNavigation"
        class="day-navigation"
        aria-label="Navegación por días"
      ></nav>
      <section id="dayContent" class="day-content"></section>
    </main>
    <footer class="footer">
      <div id="footerYear">Filipinas · 2026</div>
      <div id="footerCredit" class="creator-credit">
        Creado con la ayuda de ChatGPT
      </div>
    </footer>
    <dialog id="budgetDialog" class="budget-dialog">
      <form method="dialog" id="budgetDialogForm">
        <div class="dialog-card">
          <div class="section-head">
            <h2 id="budgetDialogTitle">Presupuesto</h2>
            <button
              id="budgetCloseButton"
              class="icon-button"
              value="cancel"
              aria-label="Cerrar"
            >
              ×
            </button>
          </div>
          <p id="budgetDialogHelp">
            Cambia aquí el presupuesto total del viaje. Se guarda en este
            dispositivo.
          </p>
          <label id="budgetDialogLabel" for="budgetDialogInput"
            >Presupuesto total (PHP)</label
          ><input id="budgetDialogInput" type="number" min="1" step="1" />
          <div class="dialog-actions">
            <button id="budgetDialogCancel" class="action" value="cancel">
              Cancelar</button
            ><button
              class="action primary"
              id="saveBudgetButton"
              value="default"
            >
              Guardar
            </button>
          </div>
        </div>
      </form>
    </dialog>
    <div class="version-badge">V8.8.1</div>
    <script src="data.js?v=8.8.1"></script>
    <script src="journey.js?v=8.8.1"></script>
    <script src="i18n.js?v=8.8.1"></script>
    <script src="flights.js?v=8.8.1"></script>
    <script src="photos.js?v=8.8.1"></script>
    <script src="today.js?v=8.8.1"></script>
    <script src="budget.js?v=8.8.1"></script>
    <script src="documentary-data.js?v=8.8.1"></script>
    <script src="journal.js?v=8.8.1"></script>
    <script src="documentary.js?v=8.8.1"></script>
    <script src="script.js?v=8.8.1"></script>
  </body>
</html>
